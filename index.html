/* ===================== CETAK LAPORAN PER MAPEL ===================== */
function doCetakLaporanMapel(){
  const c = state.ui.cetak;
  if(!c.mapel){ alert('Pilih mata pelajaran terlebih dahulu.'); return; }

  let startDate, endDate, periodeLabel;
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  if(c.jenis==='mingguan'){
    const monday = getMondayOfWeek(c.tanggal||todayStr());
    const sunday = addDays(monday,6);
    startDate = dateToStr(monday);
    endDate = dateToStr(sunday);
    periodeLabel = `Minggu ${fmtDateShort(startDate)} — ${fmtDateShort(endDate)}`;
  } else {
    const bulan = c.bulan, tahun = c.tahun;
    const daysInMonth = new Date(tahun,bulan,0).getDate();
    startDate = `${tahun}-${String(bulan).padStart(2,'0')}-01`;
    endDate = `${tahun}-${String(bulan).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
    periodeLabel = `Bulan ${monthNames[bulan-1]} ${tahun}`;
  }

  const jadwalMapel = getAllJadwalBlocks().filter(j=>j.mapel===c.mapel);
  if(jadwalMapel.length===0){ alert('Tidak ada jadwal untuk mata pelajaran ini.'); return; }

  const rows = [];
  let cursor = new Date(startDate+'T00:00:00');
  const end = new Date(endDate+'T00:00:00');
  while(cursor<=end){
    const tgl = dateToStr(cursor);
    const hari = getHariFromTanggal(tgl);
    jadwalMapel.filter(j=>j.hari===hari).forEach(jd=>{
      rows.push({tanggal:tgl, jd, entry: entryExists(jd.id, tgl)});
    });
    cursor = addDays(cursor,1);
  }
  rows.sort((a,b)=> a.tanggal.localeCompare(b.tanggal) || (a.jd.jamKeAwal||0)-(b.jd.jamKeAwal||0));

  const totalExpected = rows.length;
  const totalHadir = rows.filter(r=>r.entry && !r.entry.tidakHadir).length;
  const totalTidakHadir = rows.filter(r=>r.entry && r.entry.tidakHadir).length;
  const totalBelumInput = rows.filter(r=>!r.entry).length;
  const hadirRows = rows.filter(r=>r.entry && !r.entry.tidakHadir);
  const keluarTercatatRows = hadirRows.filter(r=>r.entry.waktuKeluar);
  const totalKeluarCepat = keluarTercatatRows.filter(r=>statusLabelOf(r.entry).includes('Keluar Lebih Cepat')).length;
  const totalKeluarTepat = keluarTercatatRows.length - totalKeluarCepat;

  const pctKehadiran = totalExpected>0 ? Math.round((totalHadir/totalExpected)*100) : 0;
  const pctKeluarTepat = keluarTercatatRows.length>0 ? Math.round((totalKeluarTepat/keluarTercatatRows.length)*100) : 0;

  const guruSet = [...new Set(jadwalMapel.map(j=>j.guru))];
  const kelasSet = [...new Set(jadwalMapel.map(j=>j.kelas))];

  const kesimpulan = buildKesimpulan(pctKehadiran, pctKeluarTepat, totalBelumInput);

  const html = buildPrintHtml({
    mapel:c.mapel, periodeLabel, guruSet, kelasSet,
    totalExpected, totalHadir, totalTidakHadir, totalBelumInput,
    totalKeluarCepat, totalKeluarTepat,
    pctKehadiran, pctKeluarTepat,
    kesimpulan, rows
  });

  const win = window.open('', '_blank');
  if(!win){ alert('Popup diblokir oleh peramban. Izinkan popup untuk mencetak laporan.'); return; }
  win.document.write(html);
  win.document.close();
  win.onload = ()=>{ win.focus(); win.print(); };
}

function buildKesimpulan(pctKehadiran, pctKeluarTepat, belumInput){
  let bag1, bag3;
  if(pctKehadiran>=90) bag1='sangat baik, hampir seluruh sesi pembelajaran terlaksana sesuai jadwal';
  else if(pctKehadiran>=75) bag1='cukup baik, meskipun masih ada beberapa sesi yang tidak terlaksana';
  else bag1='perlu menjadi perhatian karena cukup banyak sesi pembelajaran yang tidak terlaksana';

  if(pctKeluarTepat>=90) bag3='guru juga konsisten mengajar hingga waktu yang seharusnya';
  else if(pctKeluarTepat>=75) bag3='sebagian sesi diakhiri lebih cepat dari jadwal, meski secara umum masih dalam batas wajar';
  else bag3='cukup sering sesi diakhiri lebih cepat dari jadwal, sehingga durasi efektif pembelajaran berkurang';

  let extra = '';
  if(belumInput>0) extra = ` Terdapat ${belumInput} sesi yang belum diinput datanya oleh siswa sehingga belum dapat dievaluasi.`;

  return `Secara keseluruhan, tingkat kehadiran guru pada mata pelajaran ini ${bag1}. Pada saat mengakhiri pelajaran, ${bag3}. Kombinasi kehadiran dan ketepatan waktu keluar ini berdampak langsung pada keberlangsungan proses pembelajaran di kelas.${extra}`;
}

  <div class="meta"><b>Guru Pengajar</b> : ${d.guruSet.map(esc).join(', ')}</div>
  <div class="meta"><b>Dicetak pada</b> : ${todayLabel}</div>

  <div class="stat-row">
    <div class="stat-box"><div class="n">${d.totalExpected}</div><div class="l">Sesi Terjadwal</div></div>
    <div class="stat-box"><div class="n">${d.totalHadir}</div><div class="l">Hadir</div></div>
    <div class="stat-box"><div class="n">${d.totalTidakHadir}</div><div class="l">Tidak Hadir</div></div>
    <div class="stat-box"><div class="n">${d.totalBelumInput}</div><div class="l">Belum Diinput</div></div>
    <div class="stat-box"><div class="n">${d.pctKehadiran}%</div><div class="l">% Kehadiran</div></div>
    <div class="stat-box"><div class="n">${d.pctKeluarTepat}%</div><div class="l">% Tepat Waktu Keluar</div></div>
  </div>

  <h2>Rincian Sesi</h2>
  <table>
    <thead><tr><th>Tanggal</th><th>Kelas</th><th>Guru</th><th>Masuk</th><th>Keluar</th><th>Status</th></tr></thead>
    <tbody>${rowsHtml || `<tr><td colspan="6" style="text-align:center;color:#777;">Tidak ada data pada periode ini.</td></tr>`}</tbody>
  </table>

  <h2>Kesimpulan</h2>
  <div class="kesimpulan">${esc(d.kesimpulan)}</div>

  <div class="sign">
    <div>Wakil Kepala Sekolah<br/>Bidang Kurikulum<div class="line"></div></div>
    <div>Kepala Sekolah<div class="line"></div></div>
  </div>

  <div class="no-print" style="margin-top:20px;text-align:center;">
    <button onclick="window.print()">Cetak</button>
  </div>
</body></html>`;
}
