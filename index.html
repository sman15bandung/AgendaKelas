/* ===================== ANALISIS MAPEL PER TINGKAT (TANPA NAMA GURU) ===================== */
const ANALISIS_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PALET = {biru:'#3B82F6', hijau:'#22C55E', oranye:'#F59E0B', merah:'#EF4444', ungu:'#8B5CF6', tosca:'#14B8A6', pink:'#EC4899', abu:'#94A3B8'};
const WARNA_TINGKAT = {X:'#3B82F6', XI:'#10B981', XII:'#8B5CF6', Lainnya:'#F59E0B'};

function getTingkat(kelas){
  const k = String(kelas||'').trim().toUpperCase();
  let m = k.match(/^(XII|XI|X)(?![A-Z])/);
  if(m) return m[1];
  m = k.match(/^(12|11|10)/);
  if(m) return {'10':'X','11':'XI','12':'XII'}[m[1]];
  return 'Lainnya';
}
const URUTAN_TINGKAT = ['X','XI','XII','Lainnya'];

/* Rapikan nama mapel: spasi ganda, titik dua di ujung, dan nama yang terulang ("Aksi Bergizi Aksi Bergizi") */
const _mapelCanon = {};
function normMapel(n){
  let t = String(n||'').replace(/\s+/g,' ').replace(/\s*:+\s*$/,'').trim();
  const w = t.split(' ');
  if(w.length>=2 && w.length%2===0){
    const h = w.length/2;
    if(w.slice(0,h).join(' ').toLowerCase() === w.slice(h).join(' ').toLowerCase()) t = w.slice(0,h).join(' ');
  }
  const key = t.toLowerCase();
  if(!_mapelCanon[key]) _mapelCanon[key] = t;
  return _mapelCanon[key];
}

function analisisPeriode(cfg){
  let start, end, label;
  if(cfg.jenis==='harian'){
    start = end = cfg.tanggal || todayStr();
    label = `Harian — ${getHariFromTanggal(start)}, ${fmtDateShort(start)}`;
  } else if(cfg.jenis==='mingguan'){
    const mon = getMondayOfWeek(cfg.tanggal||todayStr());
    start = dateToStr(mon); end = dateToStr(addDays(mon,6));
    label = `Mingguan — ${fmtDateShort(start)} s.d. ${fmtDateShort(end)}`;
  } else {
    const b = Number(cfg.bulan), t = Number(cfg.tahun);
    const dim = new Date(t,b,0).getDate();
    start = `${t}-${String(b).padStart(2,'0')}-01`;
    end = `${t}-${String(b).padStart(2,'0')}-${String(dim).padStart(2,'0')}`;
    label = `Bulanan — ${ANALISIS_BULAN[b-1]} ${t}`;
  }
  return {start, end, label};
}

function hitungMetrik(rows){
  const m = {terjadwal:rows.length, hadir:0, tidakHadir:0, tanpaTugas:0, belum:0, terlambat:0, keluarTercatat:0, keluarCepat:0};
  rows.forEach(r=>{
    const e = r.entry;
    if(!e){ m.belum++; return; }
    if(e.tidakHadir){ m.tidakHadir++; if(!e.adaTugas) m.tanpaTugas++; return; }
    m.hadir++;
    if(e.statusMasuk==='terlambat') m.terlambat++;
    if(e.statusKeluar || e.waktuKeluar){
      m.keluarTercatat++;
      if(e.statusKeluar==='cepat') m.keluarCepat++;
    }
  });
  m.tercatat = m.hadir + m.tidakHadir;
  const pct = (a,b)=> b>0 ? Math.round((a/b)*100) : null;
  m.pctHadir = pct(m.hadir, m.tercatat);
  m.pctMasukTepat = pct(m.hadir-m.terlambat, m.hadir);
  m.pctKeluarTepat = pct(m.keluarTercatat-m.keluarCepat, m.keluarTercatat);
  m.pctCakupan = pct(m.tercatat, m.terjadwal);
  return m;
}

/* Interpretasi dalam bentuk daftar kalimat (untuk sel tabel) */
function interpretasiList(m, subjek){
  if(m.terjadwal===0) return ['Tidak ada sesi terjadwal pada periode ini.'];
  if(m.tercatat===0) return [`Belum ada data absensi yang terinput untuk ${subjek} pada periode ini, sehingga belum dapat diinterpretasikan.`];
  const out = [];
  if(m.pctHadir>=90) out.push(`Kehadiran pembelajaran ${subjek} sangat baik (${m.pctHadir}%); hampir seluruh sesi terlaksana sesuai jadwal.`);
  else if(m.pctHadir>=75) out.push(`Kehadiran pembelajaran ${subjek} cukup baik (${m.pctHadir}%), namun masih ada sesi yang tidak terlaksana.`);
  else out.push(`Kehadiran pembelajaran ${subjek} perlu perhatian (${m.pctHadir}%) karena cukup banyak sesi yang tidak terlaksana.`);

  if(m.tidakHadir>0){
    if(m.tanpaTugas>0) out.push(`Dari ${m.tidakHadir} sesi yang tidak terlaksana, ${m.tanpaTugas} sesi tidak disertai tugas pengganti sehingga siswa kehilangan waktu belajar.`);
    else out.push(`Seluruh ${m.tidakHadir} sesi yang tidak terlaksana disertai tugas pengganti, sehingga kegiatan belajar siswa tetap berjalan.`);
  }
  if(m.hadir>0){
    if(m.pctMasukTepat>=90) out.push('Pembelajaran hampir selalu dimulai tepat waktu.');
    else if(m.pctMasukTepat>=75) out.push(`Sebagian sesi dimulai terlambat (${m.terlambat} sesi), masih dalam batas wajar.`);
    else out.push(`Keterlambatan memulai pelajaran cukup sering terjadi (${m.terlambat} sesi) sehingga mengurangi waktu efektif belajar.`);
  }
  if(m.keluarTercatat>0){
    if(m.pctKeluarTepat>=90) out.push('Pembelajaran umumnya diakhiri sesuai waktu yang dijadwalkan.');
    else if(m.pctKeluarTepat>=75) out.push(`Sebagian sesi diakhiri lebih cepat dari jadwal (${m.keluarCepat} sesi).`);
    else out.push(`Sesi cukup sering diakhiri lebih cepat dari jadwal (${m.keluarCepat} sesi), sehingga durasi efektif pembelajaran berkurang.`);
  }
  if(m.pctCakupan<80) out.push(`Data baru mencakup ${m.pctCakupan}% dari sesi terjadwal (${m.belum} sesi belum diinput), sehingga hasil ini bersifat sementara.`);
  if(m.pctHadir<75 || (m.pctMasukTepat!==null && m.pctMasukTepat<75)) out.push('Disarankan tindak lanjut berupa koordinasi jadwal dan pembinaan kedisiplinan pembelajaran.');
  return out;
}
function interpretasiMetrik(m, subjek){ return interpretasiList(m, subjek).join(' '); }

function warnaLevel(m){
  if(!m || m.tercatat===0) return PALET.abu;
  const v = [m.pctHadir, m.pctMasukTepat, m.pctKeluarTepat].filter(x=>x!==null);
  const low = Math.min(...v);
  return low>=90 ? PALET.hijau : low>=75 ? PALET.oranye : PALET.merah;
}

function hitungAnalisis(cfg){
  const per = analisisPeriode(cfg);
  const today = todayStr();
  const endEff = per.end > today ? today : per.end;
  const blocks = getAllJadwalBlocks();
  const rows = [];
  if(per.start <= endEff){
    let cur = new Date(per.start+'T00:00:00');
    const end = new Date(endEff+'T00:00:00');
    while(cur<=end){
      const tgl = dateToStr(cur);
      const hari = getHariFromTanggal(tgl);
      blocks.filter(j=>j.hari===hari).forEach(jd=>{
        rows.push({tanggal:tgl, jd, mapel:normMapel(jd.mapel), tingkat:getTingkat(jd.kelas), entry:entryExists(jd.id, tgl)});
      });
      cur = addDays(cur,1);
    }
  }
  const tingkatSet = [...new Set(rows.map(r=>r.tingkat))]
    .filter(t=>cfg.tingkat==='semua' || t===cfg.tingkat)
    .sort((a,b)=>URUTAN_TINGKAT.indexOf(a)-URUTAN_TINGKAT.indexOf(b));
  const hasil = tingkatSet.map(t=>{
    const rt = rows.filter(r=>r.tingkat===t);
    const mapelSet = [...new Set(rt.map(r=>r.mapel))].sort((a,b)=>String(a).localeCompare(String(b)));
    const mapel = mapelSet.map(mp=>{
      const m = hitungMetrik(rt.filter(r=>r.mapel===mp));
      const list = interpretasiList(m,'mata pelajaran ini');
      return Object.assign({nama:mp, interpretasi:list.join(' '), interpList:list}, m);
    });
    const tot = hitungMetrik(rt);
    let ringkasan = interpretasiMetrik(tot, `Kelas ${t}`);
    const berdata = mapel.filter(x=>x.pctHadir!==null);
    if(berdata.length>1){
      const low = berdata.slice().sort((a,b)=>a.pctHadir-b.pctHadir)[0];
      if(low.pctHadir<90) ringkasan += ` Mata pelajaran dengan kehadiran terendah adalah ${low.nama} (${low.pctHadir}%).`;
    }
    return {tingkat:t, total:tot, mapel, ringkasan};
  });
  const semuaRows = rows.filter(r=>cfg.tingkat==='semua' || r.tingkat===cfg.tingkat);
  return {periode:per, rowsCount:semuaRows.length, hasil, endEff, terpotong: per.end>today};
}

function fmtPct(v){ return v===null ? '-' : v+'%'; }

/* ---------- Komponen grafik (SVG/HTML inline, dipakai di layar & cetak) ---------- */
function kartuStat(num, label, warna, bg){
  return `<div style="flex:1;min-width:120px;background:${bg};border-left:5px solid ${warna};border-radius:10px;padding:10px 14px;">
    <div style="font-size:24px;font-weight:800;color:${warna};line-height:1.1;">${num}</div>
    <div style="font-size:11.5px;color:#475569;margin-top:2px;">${label}</div></div>`;
}

function svgDonut(judul, slices, tengah, sub){
  const total = slices.reduce((a,x)=>a+x.value,0);
  const R = 54, C = 2*Math.PI*R;
  let arcs = '', off = 0;
  if(total>0){
    slices.filter(x=>x.value>0).forEach(x=>{
      const len = C * x.value/total;
      arcs += `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${x.color}" stroke-width="26" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"><title>${esc(x.label)}: ${x.value}</title></circle>`;
      off += len;
    });
  }
  const legend = slices.map(x=>{
    const pc = total>0 ? Math.round(x.value/total*100) : 0;
    return `<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#334155;margin:2px 0;"><span style="width:11px;height:11px;border-radius:3px;background:${x.color};display:inline-block;flex-shrink:0;"></span>${esc(x.label)}: <b>${x.value}</b> (${pc}%)</div>`;
  }).join('');
  return `<div style="flex:1;min-width:190px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px;text-align:center;page-break-inside:avoid;">
    <div style="font-size:12.5px;font-weight:700;color:#1E293B;margin-bottom:4px;">${esc(judul)}</div>
    <svg viewBox="0 0 160 160" width="140" height="140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="80" cy="80" r="${R}" fill="none" stroke="#EEF2F7" stroke-width="26"/>
      ${arcs}
      <text x="80" y="82" text-anchor="middle" font-size="24" font-weight="800" fill="#1E293B">${esc(String(tengah))}</text>
      <text x="80" y="98" text-anchor="middle" font-size="10" fill="#64748B">${esc(sub||'')}</text>
    </svg>
    <div style="text-align:left;display:inline-block;">${legend}</div>
  </div>`;
}

function svgBatangGrup(items, series){
  if(!items.length) return '<div style="font-size:12px;color:#64748B;">Belum ada data.</div>';
  const w = 680, leftPad = 190, rightPad = 46, barH = 11, gap = 3, rowGap = 16, top = 30;
  const rowH = series.length*(barH+gap) - gap;
  const h = top + items.length*(rowH+rowGap);
  const trackW = w - leftPad - rightPad;
  const legend = series.map((sr,i)=>`<g transform="translate(${leftPad + i*150},6)"><rect width="12" height="12" rx="3" fill="${sr.color}"/><text x="18" y="10.5" font-size="11" fill="#334155">${esc(sr.label)}</text></g>`).join('');
  const rows = items.map((it,i)=>{
    const y0 = top + i*(rowH+rowGap);
    const nm = it.label.length>30 ? it.label.slice(0,29)+'…' : it.label;
    const bars = series.map((sr,j)=>{
      const v = it.vals[j];
      const y = y0 + j*(barH+gap);
      if(v===null || v===undefined) return `<rect x="${leftPad}" y="${y}" width="${trackW}" height="${barH}" rx="4" fill="#F1F5F9"/><text x="${leftPad+6}" y="${y+barH-2}" font-size="9" fill="#94A3B8">belum ada data</text>`;
      const bw = Math.max(3, trackW*v/100);
      return `<rect x="${leftPad}" y="${y}" width="${trackW}" height="${barH}" rx="4" fill="#F1F5F9"/><rect x="${leftPad}" y="${y}" width="${bw.toFixed(1)}" height="${barH}" rx="4" fill="${sr.color}"><title>${esc(it.label)} — ${esc(sr.label)}: ${v}%</title></rect><text x="${leftPad+trackW+6}" y="${y+barH-2}" font-size="10" fill="#334155">${v}%</text>`;
    }).join('');
    return `<g><title>${esc(it.label)}</title><text x="${leftPad-8}" y="${y0+rowH/2+4}" text-anchor="end" font-size="11.5" font-weight="600" fill="#1E293B">${esc(nm)}</text>${bars}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:100%;" xmlns="http://www.w3.org/2000/svg">${legend}${rows}</svg>`;
}

const SERI_METRIK = [
  {label:'Kehadiran', color:PALET.biru},
  {label:'Masuk Tepat', color:PALET.hijau},
  {label:'Keluar Tepat', color:PALET.oranye},
];

/* Blok visual satu tingkat: kartu warna-warni + donat + batang per mapel */
function blokGrafikTingkat(h){
  const t = h.total;
  const kartu = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;">
    ${kartuStat(t.terjadwal,'Sesi Terjadwal',PALET.ungu,'#F3EEFF')}
    ${kartuStat(fmtPct(t.pctHadir),'Kehadiran',PALET.biru,'#EAF2FF')}
    ${kartuStat(fmtPct(t.pctMasukTepat),'Masuk Tepat Waktu',PALET.hijau,'#E8F9EE')}
    ${kartuStat(fmtPct(t.pctKeluarTepat),'Keluar Tepat Waktu',PALET.oranye,'#FEF3E0')}
  </div>`;
  const donat = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;">
    ${svgDonut('Status Kehadiran',[
      {label:'Hadir',value:t.hadir,color:PALET.hijau},
      {label:'Tidak Hadir',value:t.tidakHadir,color:PALET.merah},
      {label:'Belum Diinput',value:t.belum,color:PALET.abu}], fmtPct(t.pctHadir), 'hadir')}
    ${svgDonut('Ketepatan Masuk',[
      {label:'Tepat Waktu',value:t.hadir-t.terlambat,color:PALET.tosca},
      {label:'Terlambat',value:t.terlambat,color:PALET.pink}], fmtPct(t.pctMasukTepat), 'tepat waktu')}
    ${svgDonut('Ketepatan Keluar',[
      {label:'Tepat Waktu',value:t.keluarTercatat-t.keluarCepat,color:PALET.biru},
      {label:'Lebih Cepat',value:t.keluarCepat,color:PALET.oranye}], fmtPct(t.pctKeluarTepat), 'tepat waktu')}
  </div>`;
  const batang = `<div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px;margin-top:8px;">
    <div style="font-size:12.5px;font-weight:700;color:#1E293B;margin-bottom:2px;">Capaian per Mata Pelajaran (%)</div>
    ${svgBatangGrup(h.mapel.map(x=>({label:x.nama, vals:[x.pctHadir,x.pctMasukTepat,x.pctKeluarTepat]})), SERI_METRIK)}
  </div>`;
  return kartu + donat + batang;
}

/* Tabel Mata Pelajaran | Interpretasi */
function tabelInterpretasi(h, mode){

}

function judulTingkat(t){ return t==='Lainnya' ? 'Tingkat Lainnya' : 'Kelas '+t; }

function renderAnalisisMapel(){
  if(state.agendaLoading){

  }

  const tingkatAda = [...new Set(getAllJadwalBlocks().map(j=>getTingkat(j.kelas)))]
    .sort((a,b)=>URUTAN_TINGKAT.indexOf(a)-URUTAN_TINGKAT.indexOf(b));
  return `

    </select>
    <div class="btn-row">
      <button class="btn btn-primary" data-action="filter-analisis">Tampilkan</button>

    </div>

    <p class="hint" style="margin-top:14px;"><b>${esc(A.periode.label)}</b>${A.terpotong ? ' — hanya dihitung sampai hari ini' : ''}</p>
    ${A.hasil.length===0 ? `<div class="empty-state" style="margin-top:14px;"><div class="ico">📊</div>Tidak ada sesi terjadwal pada periode ini.</div>` :
      A.hasil.map(h=>`
      <div class="slot-card" style="margin-top:16px;border-left:6px solid ${WARNA_TINGKAT[h.tingkat]||PALET.abu};">
        <h3 style="font-family:'Zilla Slab',serif;margin:0 0 4px;font-size:18px;color:${WARNA_TINGKAT[h.tingkat]||PALET.abu};">${judulTingkat(h.tingkat)}</h3>
        ${blokGrafikTingkat(h)}
        <h4 style="margin:16px 0 4px;font-size:14px;">Interpretasi per Mata Pelajaran</h4>
        <div class="table-scroll">${tabelInterpretasi(h,'layar')}</div>
        <h4 style="margin:16px 0 4px;font-size:14px;">Kesimpulan ${judulTingkat(h.tingkat)}</h4>
        <p style="margin:6px 0;font-size:13.5px;line-height:1.55;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;">${esc(h.ringkasan)}</p>
      </div>`).join('')}
  `;
}

function doFilterAnalisis(){
  const c = state.ui.analisis;
  const tg = document.getElementById('an-tanggal'); if(tg) c.tanggal = tg.value || todayStr();
  const bl = document.getElementById('an-bulan'); if(bl) c.bulan = Number(bl.value);
  const th = document.getElementById('an-tahun'); if(th) c.tahun = Number(th.value) || c.tahun;
  const tk = document.getElementById('an-tingkat'); if(tk) c.tingkat = tk.value;
  render();
}

function doCetakAnalisis(){
  doFilterAnalisis();
  const A = hitungAnalisis(state.ui.analisis);
  if(A.hasil.length===0){ alert('Tidak ada data sesi pada periode ini untuk dicetak.'); return; }
  const win = window.open('', '_blank');
  if(!win){ alert('Popup diblokir oleh peramban. Izinkan popup untuk mencetak laporan.'); return; }
  win.document.write(buildAnalisisPrintHtml(A));
  win.document.close();
  win.onload = ()=>{ win.focus(); win.print(); };
}

/* ===================== DASHBOARD INTERPRETASI KEHADIRAN GURU (TANPA NAMA GURU) ===================== */
function finalisasiMetrik(m){
  m.tercatat = m.hadir + m.tidakHadir;
  const pct = (a,b)=> b>0 ? Math.round((a/b)*100) : null;
  m.pctHadir = pct(m.hadir, m.tercatat);
  m.pctMasukTepat = pct(m.hadir-m.terlambat, m.hadir);
  m.pctKeluarTepat = pct(m.keluarTercatat-m.keluarCepat, m.keluarTercatat);
  m.pctCakupan = pct(m.tercatat, m.terjadwal);
  return m;
}
function gabungMetrik(list){
  const m = {terjadwal:0,hadir:0,tidakHadir:0,tanpaTugas:0,belum:0,terlambat:0,keluarTercatat:0,keluarCepat:0};
  list.forEach(x=>Object.keys(m).forEach(k=>{ m[k] += (x[k]||0); }));
  return finalisasiMetrik(m);
}
function warnaPct(v){ return v===null ? 'var(--neutral)' : v>=90 ? 'var(--ok)' : v>=75 ? 'var(--warn)' : 'var(--danger)'; }

function renderDashboardKehadiran(){
  if(state.agendaLoading){
    return `<div class="empty-state"><div class="ico">⏳</div>Memuat data absensi...</div>`;
  }
  const c = state.ui.dash;
  const A = hitungAnalisis({jenis:c.jenis, bulan:c.bulan, tahun:c.tahun, tanggal:c.tanggal, tingkat:'semua'});
  const total = gabungMetrik(A.hasil.map(h=>h.total));

  // gabungkan mapel lintas tingkat
  const perMapel = {};
  A.hasil.forEach(h=>h.mapel.forEach(x=>{ (perMapel[x.nama] = perMapel[x.nama]||[]).push(x); }));
  const mapelAgg = Object.entries(perMapel).map(([nama,arr])=>Object.assign({nama}, gabungMetrik(arr)));
  const perhatian = mapelAgg
    .filter(x=>x.tercatat>0 && ((x.pctHadir!==null&&x.pctHadir<75) || (x.pctMasukTepat!==null&&x.pctMasukTepat<75) || (x.pctKeluarTepat!==null&&x.pctKeluarTepat<75)))
    .sort((a,b)=>(a.pctHadir??101)-(b.pctHadir??101)).slice(0,8);

  const bars = [];
  A.hasil.forEach(h=>{
    const nm = h.tingkat==='Lainnya' ? 'Lainnya' : 'Kelas '+h.tingkat;
    [['Kehadiran',h.total.pctHadir],['Masuk Tepat',h.total.pctMasukTepat],['Keluar Tepat',h.total.pctKeluarTepat]].forEach(([l,v])=>{
      if(v!==null) bars.push({label:`${nm} · ${l}`, value:v, color:warnaPct(v)});
    });
  });

  const modeBtn = (v,l)=>`<div class="radio-opt ${c.jenis===v?'selected':''}" data-action="set-dash-jenis" data-val="${v}">${l}</div>`;
  return `
    <h2 class="section-title">Dashboard Interpretasi Kehadiran Guru</h2>
    <p class="hint">Ringkasan kehadiran dan ketepatan waktu pembelajaran beserta interpretasinya. Nama guru tidak ditampilkan.</p>
    <div class="radio-group">${modeBtn('harian','Harian')}${modeBtn('mingguan','Mingguan')}${modeBtn('bulanan','Bulanan')}</div>
    ${c.jenis==='bulanan' ? `
    <div class="row">
      <div><label>Bulan</label><select id="ds-bulan">${ANALISIS_BULAN.map((m,i)=>`<option value="${i+1}" ${String(c.bulan)===String(i+1)?'selected':''}>${m}</option>`).join('')}</select></div>
      <div><label>Tahun</label><input type="number" id="ds-tahun" value="${c.tahun}"/></div>
    </div>` : `
    <div class="row"><div><label>${c.jenis==='harian'?'Tanggal':'Tanggal (dalam minggu yang dituju)'}</label><input type="date" id="ds-tanggal" value="${c.tanggal}"/></div></div>`}
    <div class="btn-row"><button class="btn btn-primary" data-action="filter-dash">Tampilkan</button></div>

    <p class="hint" style="margin-top:14px;"><b>${esc(A.periode.label)}</b>${A.terpotong?' — dihitung sampai hari ini':''}</p>
    ${total.terjadwal===0 ? `<div class="empty-state" style="margin-top:14px;"><div class="ico">📊</div>Tidak ada sesi terjadwal pada periode ini.</div>` : `
    <div class="stat-grid" style="margin-top:8px;">
      <div class="stat-card"><div class="num" style="color:${warnaPct(total.pctHadir)};">${fmtPct(total.pctHadir)}</div><div class="lbl">Kehadiran Guru</div></div>
      <div class="stat-card"><div class="num" style="color:${warnaPct(total.pctMasukTepat)};">${fmtPct(total.pctMasukTepat)}</div><div class="lbl">Masuk Tepat Waktu</div></div>
      <div class="stat-card"><div class="num" style="color:${warnaPct(total.pctKeluarTepat)};">${fmtPct(total.pctKeluarTepat)}</div><div class="lbl">Keluar Tepat Waktu</div></div>
      <div class="stat-card"><div class="num" style="color:var(--neutral);">${fmtPct(total.pctCakupan)}</div><div class="lbl">Data Terinput (${total.tercatat}/${total.terjadwal} sesi)</div></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0;">
      ${svgDonut('Status Kehadiran',[{label:'Hadir',value:total.hadir,color:PALET.hijau},{label:'Tidak Hadir',value:total.tidakHadir,color:PALET.merah},{label:'Belum Diinput',value:total.belum,color:PALET.abu}], fmtPct(total.pctHadir),'hadir')}
      ${svgDonut('Ketepatan Masuk',[{label:'Tepat Waktu',value:total.hadir-total.terlambat,color:PALET.tosca},{label:'Terlambat',value:total.terlambat,color:PALET.pink}], fmtPct(total.pctMasukTepat),'tepat waktu')}
      ${svgDonut('Ketepatan Keluar',[{label:'Tepat Waktu',value:total.keluarTercatat-total.keluarCepat,color:PALET.biru},{label:'Lebih Cepat',value:total.keluarCepat,color:PALET.oranye}], fmtPct(total.pctKeluarTepat),'tepat waktu')}
    </div>

    <div class="slot-card" style="margin-top:16px;">
      <h3 style="font-family:'Zilla Slab',serif;margin:0 0 6px;font-size:16px;">Interpretasi Umum</h3>
      <p style="margin:0;font-size:14px;line-height:1.6;">${esc(interpretasiMetrik(total,'seluruh mata pelajaran'))}</p>
      <p class="hint" style="margin:8px 0 0;">Acuan: ≥90% sangat baik, 75–89% cukup baik, &lt;75% perlu perhatian.</p>
    </div>

    <div class="slot-card" style="margin-top:16px;">
      <div class="hint" style="margin:0 0 8px;">Capaian per tingkat (%)</div>
      ${svgBatangGrup(A.hasil.map(h=>({label:h.tingkat==='Lainnya'?'Lainnya':'Kelas '+h.tingkat, vals:[h.total.pctHadir,h.total.pctMasukTepat,h.total.pctKeluarTepat]})), SERI_METRIK)}
    </div>

    <div class="slot-card" style="margin-top:16px;">
      <h3 style="font-family:'Zilla Slab',serif;margin:0 0 6px;font-size:16px;">Mata Pelajaran yang Perlu Perhatian</h3>
      ${perhatian.length===0 ? `<p style="margin:0;font-size:14px;">Tidak ada mata pelajaran dengan capaian di bawah 75% pada periode ini.</p>` :
        perhatian.map(x=>`<p style="margin:8px 0;font-size:13.5px;line-height:1.55;"><b>${esc(x.nama)}</b> — kehadiran ${fmtPct(x.pctHadir)}, masuk tepat ${fmtPct(x.pctMasukTepat)}, keluar tepat ${fmtPct(x.pctKeluarTepat)}.<br>${esc(interpretasiMetrik(x,'mata pelajaran ini'))}</p>`).join('')}
    </div>

    ${A.hasil.map(h=>`
    <div class="slot-card" style="margin-top:16px;">
      <h3 style="font-family:'Zilla Slab',serif;margin:0 0 6px;font-size:16px;">Interpretasi ${h.tingkat==='Lainnya'?'Tingkat Lainnya':'Kelas '+h.tingkat}</h3>
      <p style="margin:0 0 6px;font-size:13px;color:var(--ink-soft);">${h.mapel.length} mata pelajaran · ${h.total.terjadwal} sesi terjadwal · kehadiran ${fmtPct(h.total.pctHadir)}</p>
      <p style="margin:0;font-size:14px;line-height:1.6;">${esc(h.ringkasan)}</p>
    </div>`).join('')}
    `}
  `;
}

  const c = state.ui.dash;

  const bl = document.getElementById('ds-bulan'); if(bl) c.bulan = Number(bl.value);
